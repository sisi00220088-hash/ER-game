<script>
// ===== 設定(集中管理)=====
const CFG={start:450,end:960,rates:[0,0.7,2.5,1.2],speed:5.5,pr:0.45,reach:1.8,

const TRT=[[2,'dressing'],[8,'dressing'],[3,'steam'],[6,'steam'],[10,'steam']];
const SCALE=[[150,0],[200,2],[250,4],[300,6],[1e9,8]];const scaleDose=bg=>SCALE.find(r=>bg<=r[0])[1];

function judgeVitals(v){const o=[];for(const k of ['T','P','R','SpO2']){if(v[k]<REF[k][0]||v[k]>REF[k][1])o.push(k)}
 if(v.SBP<REF.SBP[0]||v.SBP>REF.SBP[1])o.push('SBP');if(v.DBP<REF.DBP[0]||v.DBP>REF.DBP[1])o.push('DBP');return o}
// ===== 遊戲狀態 =====
const S={t:CFG.start,mode:1,hidden:false,modal:false,phase:'play',stress:0,score:0,log:[],tasks:[],nav:false,over:false,errors:0,blocks:0,lt:450,stam:100,hung:0,ate:null,mealAt:0,intr:0,w1:0,w2:0,started:false,deaths:[]};
function addLog(pts,why){S.score+=pts;S.log.push({t:S.t,pts,why});if(pts)pop(pts)}
function mk(id,type,bed,title,due,pri){const o={id,type,bed,title,tag:title.replace(/^\d+ 床 /,''),due,pri,status:'locked',cost:CFG.cost[type]||5,late:false,overdue:false,result:''};S.tasks.push(o);return o}

for(let i=0;i<13;i++){const o=mk('v'+i,'vitals',i,(i+1)+' 床 生命徵象',570+(i%3)*30,5);if(!OCC.includes(i))o.status='cancelled'}
const lastS={};MEDS.forEach(([b,s,d,x])=>{const sl=SLOT[s];Object.assign(mk('m'+b+s,'med',b,(b+1)+' 床 '+sl[0],sl[2],6),{tag:sl[0]+' '+DRUGS[d]+' '+x+'mg',drug:DRUGS[d],dose:x,from:sl[1],slotName:sl[0],req:lastS[s]});lastS[s]='m'+b+s});
Object.keys(BG).forEach(k=>{const b=+k;mk('g'+b,'glucose',b,(b+1)+' 床 血糖檢測',600,6);Object.assign(mk('i'+b,'insulin',b,(b+1)+' 床 胰島素(Sliding Scale)',630,7),{req:'g'+b})});
TRT.forEach(([b,k])=>mk(k+b,k,b,(b+1)+' 床 '+(k==='dressing'?'傷口換藥':'蒸氣治療'),k==='dressing'?780:720,4));
const CHIEFS=[{c:'70歲男性,主訴胸悶合併冒冷汗,自述像有石頭壓著(虛構案例)',lvl:2},{c:'扭傷腳踝,可自行走入,疼痛但生命徵象穩定(虛構案例)',lvl:4},{c:'高燒 39.5度合併意識改變,家屬代訴反應變遲鈍(虛構案例)',lvl:2},{c:'車禍外傷,前額撕裂傷合併少量出血(虛構案例)',lvl:3},{c:'腹瀉合併輕微脫水,活動力正常(虛構案例)',lvl:4},{c:'氣喘發作,呼吸喘合併端坐呼吸(虛構案例)',lvl:2}];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const CH=shuffle(CHIEFS).slice(0,3),TJIT=[560,720,890].map(t=>Math.max(470,Math.min(930,t+Math.round((Math.random()-.5)*30))));
const KTASREF=['第 1 級・復甦急救(立即處理):心跳/呼吸停止、持續抽搐且無意識、嘴唇發青發紫、體溫>41°C或<32°C','第 2 級・危急(約等 10 分鐘):急性意識改變、持續胸悶胸痛合併冒冷汗、低血糖(<40)、外傷大量出血、高處墜落車禍被拋出、頭部撞擊曾昏迷','第 3 級・緊急(約等 30 分鐘):無法控制腹瀉嘔吐、外傷腫脹變形疑骨折脫臼、高血壓(收縮>200或舒張>110)但無症狀','第 4 級・次緊急(約等 60 分鐘):局部蜂窩性組織炎、急性咳嗽但無發燒、發燒但無其他不適、反覆疼痛或暈眩','第 5 級・非緊急(約等 120 分鐘):慢性噁心嘔吐打嗝、輕微擦傷瘀青、輕微腹瀉無脫水跡象'];
const EVT=[
{id:'vo',ev:'vo',t:'口頭醫囑:3 床加藥',loc:'station',at:550,lim:40,pri:8,fp:-6},
{id:'cb1',ev:'cb1',t:'🚨 Code Blue:取急救車',loc:'crash',at:620,lim:30,pri:20,fp:-10,p:5},
{id:'cb2',ev:'cb2',t:'🚨 Code Blue:9 床急救',bed:8,at:620,lim:30,pri:20,fp:-20,req:'cb1',p:15,c:8},
{id:'cv',ev:'cv',t:'危急值通報:7 床',loc:'station',at:675,lim:15,pri:15,fp:-12,p:12,c:4},
{id:'dcCall',ev:'dcCall',t:'內科病房交班電話:11 床轉出',loc:'station',at:680,lim:45,pri:10,fp:-8,p:10,c:6},
{id:'dc',ev:'dc',t:'11 床辦理出院手續',bed:10,at:700,lim:80,pri:6,fp:-6,p:8,c:12,req:'dcCall'},
{id:'bell',ev:'step',t:'呼叫鈴:4 床',bed:3,at:720,lim:50,pri:4,fp:-4,p:5,c:4,steps:['詢問需求','協助並記錄']},
{id:'fam',ev:'fam',t:'家屬詢問:7 床',bed:6,at:800,lim:40,pri:7,fp:-5},
{id:'fam2',ev:'fam2',t:'激動家屬:3 床',bed:2,at:880,lim:25,pri:12,fp:-8},
{id:'fam3',ev:'fam3',t:'家屬催促:5 床',bed:4,at:760,lim:30,pri:9,fp:-6},
{id:'tr',ev:'tr',t:'轉床:4 床轉至觀察床',bed:3,at:810,lim:60,pri:9,fp:-8,p:10,c:12},
{id:'triage1',ev:'triage',t:'🚑 救護車送達:檢傷評估',loc:'triage',at:TJIT[0],lim:20,pri:CH[0].lvl<=2?12:6,fp:-8,p:8,c:4,chief:CH[0].c,lvl:CH[0].lvl},
{id:'triage2',ev:'triage',t:'🚑 救護車送達:檢傷評估',loc:'triage',at:TJIT[1],lim:20,pri:CH[1].lvl<=2?12:6,fp:-8,p:8,c:4,chief:CH[1].c,lvl:CH[1].lvl},
{id:'triage3',ev:'triage',t:'🚑 救護車送達:檢傷評估',loc:'triage',at:TJIT[2],lim:20,pri:CH[2].lvl<=2?12:6,fp:-8,p:8,c:4,chief:CH[2].c,lvl:CH[2].lvl},
{id:'iv',ev:'step',t:'點滴空瓶:5 床',bed:4,at:850,lim:20,pri:9,fp:-6,p:6,c:4,steps:['關閉點滴並更換藥袋','確認滴速與管路']}];
EVT.forEach(e=>Object.assign(mk(e.id,'event',e.bed==null?null:e.bed,e.t,e.at+e.lim,e.pri),{ev:e.ev,from:e.at,loc:e.loc,fp:e.fp,pts:e.p,req:e.req,steps:e.steps,cost:e.c||5,chief:e.chief,lvl:e.lvl}));
mk('endshift','endshift',null,'班末交班與文書(護理站)',null,7);
mk('io','doc',null,'24 小時出入量統計',null,9);Object.assign(mk('fall','doc',null,'防跌評估單',null,9),{req:'io'});Object.assign(mk('unfin','doc',null,'當班未完成任務確認',null,9),{req:'fall'});
const T=id=>S.tasks.find(x=>x.id===id);
// 狀態轉換統一入口
function setStatus(t,s){if(S.over||t.status===s||t.status==='completed'||t.status==='cancelled')return;t.status=s;}
function refreshLocks(){const c=T('clockin').status==='completed',h=T('handover').status==='completed';
 if(c&&T('handover').status==='locked')setStatus(T('handover'),'available');
 if(h)S.tasks.forEach(t=>{if(t.status==='locked'&&!['clockin','handover','endshift','event','doc'].includes(t.type)&&(t.type==='vitals'?(t.bed===0||['completed','cancelled'].includes(T('v'+(t.bed-1)).status)):S.tasks.filter(x=>x.type==='vitals'&&!x.nv).every(x=>['completed','cancelled'].includes(x.status)))&&(!t.from||S.t>=t.from)&&(!t.req||['completed','cancelled'].includes(T(t.req).status)))setStatus(t,'available')});
 if(S.phase==='ending'){S.tasks.forEach(t=>{if(t.type==='doc'&&t.status==='locked'&&(!t.req||T(t.req).status==='completed'))setStatus(t,'available')});if(T('endshift').status==='locked'&&T('unfin').status==='completed')setStatus(T('endshift'),'available')}
 if(!c&&T('clockin').status==='locked')setStatus(T('clockin'),'available');S.tasks.forEach(t=>{if(t.type==='event'&&t.status==='locked'&&S.t>=t.from&&(!t.req||T(t.req).status==='completed')){setStatus(t,'available');alert_(t)}});}

function killPatient(b,reason){if(bedState[b]==='deceased')return;bedState[b]='deceased';setOcc(b,true);pats[b].material.color.set(0x55555f);bedMesh[b].material.color.set(0x333333);S.tasks.forEach(x=>{if(x.bed===b&&!['completed','cancelled'].includes(x.status)&&x.ev!=='dc'&&x.ev!=='adm')setStatus(x,'cancelled')});S.deaths.push({bed:b,t:S.t,reason});addLog(-25,(b+1)+' 床搜救無效,宣告死亡:'+reason);S.errors++;S.stress=Math.min(100,S.stress+10);toast('💔 '+(b+1)+' 床搜救無效,已宣告死亡')}

const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(1.5,devicePixelRatio));document.body.prepend(R.domElement);
